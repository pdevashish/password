<!DOCTYPE html>
<html>
<head>
    <title>Password Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        input[type="text"] {
            padding: 0.8rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        input[type="submit"] {
            padding: 0.8rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }

        .result-container {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
            word-break: break-word;
        }

        .error {
            background: #ffe3e3;
            color: #dc3545;
        }

        .copy-btn {
            padding: 0.6rem 1rem;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Password Generator <br> BY !NF!N!T€</h1>
    <form id="passwordForm">
        <input type="text" id="ssid" maxlength="4" placeholder="Enter SSID" required>
        <input type="submit" value="Generate Password">
    </form>
    <div id="result" class="result-container" style="display:none;">
        <p id="resultText"></p>
        <button class="copy-btn" onclick="copyPassword()">Copy Password</button>
    </div>
</div>

<script>
    function sha1(msg) {
        // A full SHA1 function is needed. For brevity, you can use an external library like crypto.subtle or include a SHA1 polyfill.
        // Placeholder implementation:
        return CryptoJS.SHA1(msg).toString(CryptoJS.enc.Hex).toUpperCase();
    }

    function pQ7z(code) {
        const uJ8 = [37, 35, 29, 31, 21, 27, 23, 25, 22, 9, 13, 33, 8, 7];
        const hash = sha1(code);
        return uJ8.map(index => hash[index]).join('');
    }

    document.getElementById('passwordForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const code = document.getElementById('ssid').value;
        const resultBox = document.getElementById('result');
        const resultText = document.getElementById('resultText');

        if (code.length === 4 && /^\d{4}$/.test(code)) {
            const password = pQ7z(code);
            resultText.textContent = password;
            resultBox.classList.remove('error');
        } else {
            resultText.textContent = 'Invalid';
            resultBox.classList.add('error');
        }
        resultBox.style.display = 'block';
    });

    function copyPassword() {
        const text = document.getElementById('resultText').textContent;
        navigator.clipboard.writeText(text).then(() => alert("Password copied to clipboard!"));
    }
</script>

<!-- Include CryptoJS SHA1 library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

</body>
</html>
