
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #141e30, #243b55);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
    }

    .wrapper {
      background: #1c1f2b;
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      max-width: 400px;
      width: 100%;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      text-align: center;
      color: #f3f3f3;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input[type="text"] {
      padding: 0.9rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      background: #2c2f3d;
      color: #fff;
    }

    input[type="text"]:focus {
      outline: 2px solid #7289da;
    }

    input[type="submit"] {
      padding: 0.9rem;
      background: #7289da;
      border: none;
      color: white;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    input[type="submit"]:hover {
      background: #5f73bc;
    }

    .output {
      margin-top: 1.5rem;
      background: #2c2f3d;
      padding: 1rem;
      border-radius: 10px;
      text-align: center;
      word-break: break-word;
    }

    .output.invalid {
      background: #442626;
      color: #ff6b6b;
    }

    .btn-copy {
      margin-top: 0.8rem;
      padding: 0.6rem 1rem;
      background: #3ba55d;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.3s;
    }

    .btn-copy:hover {
      background: #2f8d4d;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Password Generator by !NF!N!T€</h1>
    <form id="X0">
      <input type="text" id="A1" maxlength="4" placeholder="Enter 4 Digit SSID" required>
      <input type="submit" value="Generate">
    </form>
    <div id="Z9" class="output" style="display:none;">
      <p id="B2"></p>
      <button class="btn-copy" onclick="window.C3()">Copy</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script>
    (() => {
      const F1 = x => CryptoJS.SHA1(x).toString(CryptoJS.enc.Hex).toUpperCase();
      const F2 = y => [...[37, 35, 29, 31, 21, 27, 23, 25, 22, 9, 13, 33, 8, 7]].map(i => y[i]).join('');
      const F3 = z => /^\d{4}$/.test(z);

      const F4 = (t) => {
        const h = F1(t);
        return F2(h);
      };

      const F5 = () => {
        const x = document.getElementById('A1').value.trim();
        const o = document.getElementById('Z9');
        const r = document.getElementById('B2');
        if (!F3(x)) {
          r.textContent = 'Invalid';
          o.classList.add('invalid');
        } else {
          r.textContent = F4(x);
          o.classList.remove('invalid');
        }
        o.style.display = 'block';
      };

      document.getElementById('X0').addEventListener('submit', e => {
        e.preventDefault();
        F5();
      });

      window.C3 = () => {
        const txt = document.getElementById('B2').textContent;
        navigator.clipboard.writeText(txt).then(() => alert('Copied!'));
      };
    })();
  </script>
</body>
</html>
